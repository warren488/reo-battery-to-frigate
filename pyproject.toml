[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reo-batter-to-frigate"
version = "0.1.0"
description = "Bridge between Reolink battery cameras (FTP uploads) and Frigate NVR (continuous RTSP stream)"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
]

[project.scripts]
reo-bridge = "reo_bridge.main:main"
