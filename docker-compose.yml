services:
  # ------------------------------------------------------------------
  # MediaMTX — lightweight RTSP server
  # The bridge pushes video here; Frigate connects here to pull it.
  # ------------------------------------------------------------------
  mediamtx:
    # Pinned: MediaMTX has changed config semantics between minor versions
    image: bluenviron/mediamtx:1.16.3
    ports:
      # RTSP port — Frigate connects to rtsp://this-host:8654/camera
      # (8554 is avoided — Frigate uses it for its own restreaming)
      - "8654:8554"
      # RTMP (optional, useful for debugging with VLC etc.)
      - "1945:1935"
      # WebRTC / HLS (optional)
      - "8889:8888"
    restart: unless-stopped

  # ------------------------------------------------------------------
  # The bridge itself
  # ------------------------------------------------------------------
  reo-bridge:
    build: .
    depends_on:
      - mediamtx
    environment:
      # Where uploaded video files appear (mapped via volume below)
      WATCH_DIR: /watch

      # Push stream to the MediaMTX container
      RTSP_OUTPUT_URL: rtsp://mediamtx:8554/camera

      # Match your Reolink camera resolution (2K default for most battery cams)
      STREAM_WIDTH: "2560"
      STREAM_HEIGHT: "1440"
      STREAM_FPS: "20"

      # Seconds to wait for a file to stop growing before considering it ready
      SETTLE_SECONDS: "2.0"

      # Set to "true" to auto-delete files after streaming
      DELETE_AFTER_STREAM: "false"

      # Experimental: start streaming before the upload finishes.
      # Works best with fragmented MP4 or FLV; standard MP4 (moov at EOF) may
      # show no frames until the full upload completes regardless.
      # REALTIME_STREAMING: "false"
      # REALTIME_DELAY_SECONDS: "5.0"

      # Web UI port (for tuning encoder settings)
      # (5000 is avoided — Frigate uses it for its own web UI)
      WEB_PORT: "5001"

      # Where web-UI tuned settings are persisted (survives restarts)
      # PARAMS_FILE: /data/params.json

      # Mirrors of the FTP settings below — shown in the web UI's
      # "Camera FTP Setup" card so you can copy them into the camera
      FTP_PUBLIC_HOST: "${FTP_PUBLIC_HOST:-}"
      FTP_USER: "${FTP_USER:-reolink}"
      FTP_PASS: "${FTP_PASS:-reolink}"
    ports:
      - "5001:5001"
    volumes:
      - ./watch_dir:/watch
      - ./data:/data
    restart: unless-stopped

  # ------------------------------------------------------------------
  # FTP Server — receives uploads from Reolink cameras
  # Cameras upload clips here; they land in the shared watch volume.
  # ------------------------------------------------------------------
  ftp:
    # Pinned by digest — this image only publishes a moving "latest" tag
    image: stilliard/pure-ftpd@sha256:bfdfe0d725bee473b6c06ec0c39d6956dcaa2a504a1e33825ecf41242f05b436
    ports:
      # FTP command port
      - "21:21"
      # Passive mode data ports
      - "30000-30009:30000-30009"
    environment:
      PUBLICHOST: "${FTP_PUBLIC_HOST:-localhost}"
      FTP_USER_NAME: "${FTP_USER:-reolink}"
      FTP_USER_PASS: "${FTP_PASS:-reolink}"
      FTP_USER_HOME: /home/ftpuser
      FTP_PASSIVE_PORTS: "30000:30009"
    volumes:
      - ./watch_dir:/home/ftpuser
    restart: unless-stopped
